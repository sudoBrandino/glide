[package]
name = "glide-client"
version = "0.1.0"
edition = "2021"
description = "Glide remote desktop viewer (Windows client)"
publish = false
build = "build.rs"

[lib]
name = "glide"
path = "src/lib.rs"

[[bin]]
name = "glide-client"
path = "src/main.rs"

[dependencies]
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.8"
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Clipboard images (PNG <-> DIB). Pure Rust (miniz_oxide/fdeflate), cross-compiles with MinGW.
png = "0.18.1"

[build-dependencies]
# MSVC targets only: compiles res/glide.rc with rc.exe (the GNU target uses MinGW windres directly).
embed-resource = "3"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Media_Multimedia",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Storage_Xps",
    "Win32_Storage_FileSystem",
]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# The build script runs on the build machine; don't strip it (rust-objcopy may be unavailable
# when cross-compiling from macOS).
[profile.release.build-override]
strip = false

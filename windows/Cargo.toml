[package]
name = "glide-client"
version = "0.3.1"
edition = "2021"
description = "Glide remote desktop viewer (Windows client)"
license = "MIT"
repository = "https://github.com/sudoBrandino/glide"
publish = false
build = "build.rs"

[lib]
name = "glide"
path = "src/lib.rs"

[[bin]]
name = "glide-client"
path = "src/main.rs"

# Windows host: lets a Mac viewer control this PC (docs/WINDOWS_HOST.md).
[[bin]]
name = "glide-host"
path = "src/bin/glide-host.rs"

[dependencies]
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.8"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Clipboard images (PNG <-> DIB). Pure Rust (miniz_oxide/fdeflate), cross-compiles with MinGW.
png = "0.18.1"

[build-dependencies]
# MSVC targets only: compiles res/glide.rc with rc.exe (the GNU target uses MinGW windres directly).
embed-resource = "3"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Media_Multimedia",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # ICodecAPI::SetValue (VARIANT) for the host's encoder settings.
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Storage_Xps",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
]

[features]
# Test hooks for SSH / session-0 smoke tests (GLIDE_PAIR_CONFIRM, GLIDE_SETUP_ANSWER, the dialog and
# frame dumps, GLIDE_TEST_ACTIONS, GLIDE_TEST_SEND_FILES; see util::TEST_HOOK_VARS). Off by default,
# so release builds ignore them: a variable left set must never answer a pairing prompt.
test-hooks = []

[dev-dependencies]

# CI runs `cargo clippy --all-targets -- -D warnings` for the host and the Windows target.
# Default lint set, minus a few style judgments that would mean churn without a fix.
[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
# Rewrites hot pixel/sample loops to `as_chunks`; not worth the churn (and newer than many toolchains).
chunks_exact_to_as_chunks = "allow"

[lints.rust]
# Lets toolchains older than CI's (which may not know a lint named above) build without warnings.
unknown_lints = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# The build script runs on the build machine; don't strip it (rust-objcopy may be unavailable
# when cross-compiling from macOS).
[profile.release.build-override]
strip = false

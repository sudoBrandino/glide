name: Homebrew tap

# When a release is published (not while it's a draft: Homebrew can't download draft assets),
# copy its glide-host.rb (written by tools/release.sh cask) to the tap repository as
# Casks/glide-host.rb, so `brew upgrade` picks it up. See packaging/homebrew/README.md.
#
# Needs the repository secret HOMEBREW_TAP_TOKEN: a fine-grained token with "Contents: read and
# write" on sudoBrandino/homebrew-glide only. Without it the job does nothing. Run it by hand
# (workflow_dispatch) to republish the cask of an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z)"
        required: true

permissions:
  contents: read

env:
  TAP_REPO: sudoBrandino/homebrew-glide
  CASK_PATH: Casks/glide-host.rb

jobs:
  update:
    name: Update Casks/glide-host.rb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    steps:
      - name: Push the cask to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: not updating $TAP_REPO."
            exit 0
          fi
          case "$TAG" in v[0-9]*) ;; *) echo "::error::bad tag '$TAG'"; exit 1 ;; esac
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern glide-host.rb --dir "$RUNNER_TEMP"
          f="$RUNNER_TEMP/glide-host.rb"
          grep -q "^  version \"${TAG#v}\"$" "$f" || { echo "::error::glide-host.rb is not for $TAG"; exit 1; }
          export GH_TOKEN="$TAP_TOKEN"
          # On an error (first release: no file yet) gh prints the error body, not the jq result.
          sha="$(gh api "repos/$TAP_REPO/contents/$CASK_PATH" --jq .sha 2>/dev/null)" || sha=""
          args=(-X PUT "repos/$TAP_REPO/contents/$CASK_PATH"
                -f message="glide-host ${TAG#v}"
                -f content="$(base64 -w0 "$f")")
          [ -n "$sha" ] && args+=(-f sha="$sha")
          gh api "${args[@]}" --jq '.commit.html_url'
          echo "Updated $TAP_REPO/$CASK_PATH to ${TAG#v}." >> "$GITHUB_STEP_SUMMARY"

name: CI

# Third-party actions are pinned to commit SHAs; Dependabot keeps them current
# (.github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Reference crypto vectors: the Python generator must reproduce the committed file exactly.
  vectors:
    name: Test vectors (Python reference)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Version consistency (VERSION, Cargo.toml, Version.swift) and changelog entry
        run: tools/release.sh check
      - name: Regenerate and compare
        run: |
          python3 tools/glide_noise.py                                # official Noise vectors
          python3 tools/gen_vectors.py "$RUNNER_TEMP/v.json"
          cmp "$RUNNER_TEMP/v.json" docs/test-vectors.json
          python3 tools/gen_vectors.py --check docs/test-vectors-rust.json  # Rust transcript, replayed in Python
          python3 tools/mock_host.py --display-vectors "$RUNNER_TEMP/d.json"  # §3.5 display messages + matching
          cmp "$RUNNER_TEMP/d.json" docs/display-vectors.json
          python3 tools/mock_host.py --input-vectors "$RUNNER_TEMP/i.json"    # §3.6 input messages
          cmp "$RUNNER_TEMP/i.json" docs/input-vectors.json
          python3 tools/mock_host.py --file-vectors "$RUNNER_TEMP/f.json"     # §6 file messages + name rules
          cmp "$RUNNER_TEMP/f.json" docs/file-transfer-vectors.json
          python3 tools/mock_host.py --selftest                               # Python reference self-checks
      - name: No personal paths in the tree
        # Examples and tests use placeholders such as %USERPROFILE% or C:\Users\me; see CONTRIBUTING.md.
        run: |
          if git grep -nIE 'C:[\\/]+Users[\\/]+[a-z0-9]+[\\/]|/Users/[a-z0-9]+/|/home/[a-z0-9]+/' -- . \
               ':!.github/workflows/ci.yml' | grep -vE 'Users[\\/]+(me|you|runner|<)'; then
            echo "::error::a personal path was committed; use a placeholder"; exit 1
          fi

  # Swift host: release build + protocol self-test against docs/test-vectors.json.
  mac:
    name: Mac host (Swift build + selftest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mac/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mac/Package.swift', 'mac/Sources/**') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Build (release)
        working-directory: mac
        # The default build backend is used when it works; fall back to the native backend
        # (needed with Command Line Tools-only setups, see README).
        run: |
          if ! swift build -c release; then
            echo "::warning::default build system failed; retrying with --build-system native"
            swift build -c release --build-system native
          fi
      - name: Self-test
        working-directory: mac
        run: |
          BIN="$(swift build -c release --show-bin-path 2>/dev/null || echo .build/release)"
          [ -x "$BIN/glide-selftest" ] || BIN=.build/release
          "$BIN/glide-selftest" ../docs/test-vectors.json
      - name: Tools compile / syntax check
        run: |
          swiftc -O tools/display-mode.swift -o "$RUNNER_TEMP/glide-display-mode"
          swiftc -O tools/compare.swift -o "$RUNNER_TEMP/glide-compare"
          for f in tools/*.sh; do bash -n "$f"; done
          python3 -m py_compile tools/mock_host.py tools/gen_vectors.py tools/glide_noise.py

  # Rust viewer: platform-independent unit tests on Linux, plus the MinGW cross-build of the exe.
  rust:
    name: Viewer (cargo test + Windows cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: windows
      - name: cargo test
        # Includes the seeded fuzz tests (src/fuzz_tests.rs); GLIDE_FUZZ_SEED reproduces a failure.
        run: cargo test --locked
      - name: cargo clippy (Linux, and the Windows target for src/win)
        # Lint levels are in Cargo.toml [lints]. `cargo fmt --check` isn't enforced yet: the tree
        # predates rustfmt and CONTRIBUTING asks to format only touched code.
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Cross-build glide-client.exe (x86_64-pc-windows-gnu)
        run: cargo build --locked --release --target x86_64-pc-windows-gnu
      - name: Check exe
        run: |
          EXE=target/x86_64-pc-windows-gnu/release/glide-client.exe
          ls -l "$EXE"
          file "$EXE"
          # Must not depend on MinGW runtime DLLs (+crt-static in .cargo/config.toml).
          if x86_64-w64-mingw32-objdump -p "$EXE" | grep -iE 'DLL Name: (libgcc|libwinpthread|libstdc)'; then
            echo "::error::exe links MinGW runtime DLLs"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glide-client-windows-x64
          path: windows/target/x86_64-pc-windows-gnu/release/glide-client.exe
          if-no-files-found: error
          retention-days: 14

  # Native Windows build (MSVC) + tests, and a smoke run of --probe (no GPU decoder on the runner,
  # so only check that it runs and exits cleanly; the decode verdict is informational).
  windows:
    name: Viewer (native Windows build + probe smoke)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: windows
      - name: cargo test
        run: cargo test --locked
      - name: Build (release, MSVC)
        run: cargo build --locked --release
      - name: Probe smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\glide-client.exe -ArgumentList '--probe' `
                -NoNewWindow -PassThru -RedirectStandardOutput probe.json -RedirectStandardError probe.err
          $null = $p.Handle  # keep the handle so ExitCode is available after exit
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "--probe hung"; exit 1 }
          Get-Content probe.json; Get-Content probe.err
          "exit code: $($p.ExitCode)"
          # 101 = Rust panic; negative = NTSTATUS crash (0xC0000005 access violation etc.)
          if ($p.ExitCode -eq 101 -or $p.ExitCode -lt 0) { Write-Error "--probe crashed"; exit 1 }
          Get-Content probe.json -Raw | ConvertFrom-Json | Out-Null
